[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-redteam"
version = "0.2.0"
description = "Auditing LLM-as-Judge under controlled answer interventions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Richard Shen" }]
keywords = ["llm", "evaluation", "llm-as-judge", "benchmark", "reward-hacking", "calibration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
viz = ["matplotlib>=3.8,<4"]

[project.urls]
Repository = "https://github.com/richardgshen-hub/judge-redteam"
Issues = "https://github.com/richardgshen-hub/judge-redteam/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
# Keep CI focused on correctness errors. Broader style cleanup is deliberately
# separate from scientific-method changes so reviews remain readable.
select = ["E9", "F63", "F7", "F82"]
